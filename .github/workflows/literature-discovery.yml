name: HFpEF literature discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/literature-discovery.yml'
      - 'scripts/discover_literature.py'
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover bibliographic candidates
        run: python scripts/discover_literature.py --max-pubmed 1500 --max-trials 400
      - name: Confirm curated data unchanged and structurally valid
        run: python scripts/validate_data.py
      - name: Commit only candidate citations, never unverified clinical outcomes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery_candidates.json data/discovery_candidates.csv data/discovery_search_log.json
          if ! git diff --cached --quiet; then
            git commit -m "Update unreviewed HFpEF literature search queue"
            git push
          fi
