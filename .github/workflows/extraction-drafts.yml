name: HFpEF LLM extraction drafts (manual review only)
on:
  workflow_dispatch:
    inputs:
      pmids:
        description: 'Optional comma-separated PubMed IDs from discovery queue'
        required: false
        type: string
        default: ''
      limit:
        description: 'Number of papers (1-10); API costs apply'
        type: choice
        options: ['1', '3', '5', '10']
        default: '3'
      priority:
        description: 'Priority for automatic candidate selection when PMIDs are blank'
        type: choice
        options: ['High', 'Medium', 'all']
        default: 'High'
      llm_check:
        description: 'Run optional second LLM source audit (extra cost)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check configuration
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'Missing OPENAI_API_KEY in repository Actions secrets. See docs/LLM_EXTRACTION.md.'
            exit 1
          fi
      - name: Generate draft extracts (does not update studies.json)
        env:
          INPUT_PMIDS: ${{ inputs.pmids }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_PRIORITY: ${{ inputs.priority }}
          INPUT_AUDIT: ${{ inputs.llm_check }}
        shell: bash
        run: |
          args=(--limit "$INPUT_LIMIT" --priority "$INPUT_PRIORITY")
          if [ -n "$INPUT_PMIDS" ]; then args+=(--pmids "$INPUT_PMIDS"); fi
          if [ "$INPUT_AUDIT" = 'true' ]; then args+=(--llm-check); fi
          python scripts/extract_candidates.py "${args[@]}"
      - name: Upload unreviewed drafts and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unreviewed-extraction-drafts
          path: outputs/extraction_drafts/
          retention-days: 14
          if-no-files-found: warn
